# ============================================================
# Verified sources (free, real data) — primary inputs
# ============================================================
sources:
  rss:
    enabled: true
    feeds:
      # --- Major AI labs ---
      # Note: Anthropic has no official RSS feed as of 2026; covered via HN + social signals.
      - name: "OpenAI News"
        url: "https://openai.com/news/rss.xml"
      - name: "Google DeepMind Blog"
        url: "https://deepmind.google/blog/rss.xml"
      - name: "Google AI Blog"
        url: "https://blog.google/technology/ai/rss/"
      - name: "Meta Engineering Blog"
        url: "https://engineering.fb.com/feed/"
      - name: "Meta Newsroom"
        url: "https://about.fb.com/feed/"
      - name: "Microsoft Research"
        url: "https://www.microsoft.com/en-us/research/feed/"
      # --- Chip & hardware companies ---
      - name: "NVIDIA AI Blog"
        url: "https://developer.nvidia.com/blog/category/artificial-intelligence/feed/"
      - name: "Intel Tech (Medium)"
        url: "https://medium.com/feed/intel-tech"
      - name: "Intel Newsroom"
        url: "https://newsroom.intel.com/feed/"
      # Note: Qualcomm has no public RSS feed; covered via HN + social signals.
      # --- Cloud / infra ---
      - name: "AWS Machine Learning Blog"
        url: "https://aws.amazon.com/blogs/machine-learning/feed/"
      # --- Community & independent ---
      - name: "Hugging Face Blog"
        url: "https://huggingface.co/blog/feed.xml"
      - name: "Simon Willison"
        url: "https://simonwillison.net/atom/everything/"
      # Add more feeds here — any RSS 2.0 or Atom URL works.

  arxiv:
    enabled: true
    categories: ["cs.AI", "cs.CL", "cs.LG", "cs.CV", "cs.NE"]
    max_results: 50

  hackernews:
    enabled: true
    queries:
      - "AI"
      - "LLM"
      - "GPT"
      - "Claude"
      - "Gemini"
      - "open source model"
      - "NVIDIA"
      - "Anthropic"
      - "Qualcomm"
      - "Intel AI"
      - "machine learning"
    min_points: 30        # only stories with at least this many points

# ============================================================
# Social signals via Gemini search grounding — SUPPLEMENTARY.
# X/Twitter has no free read API; these results come from LLM
# web search and are UNVERIFIED (clearly labeled in the report).
# Set enabled: false to skip and save quota.
# ============================================================
twitter:
  enabled: true
  # Number of days to look back
  days_back: 1
  # Models tried in order for search-grounding calls (must support google_search tool).
  # Falls back to next on 429/404/503. From models.list() cross-referenced with quota status.
  search_grounding_models:
    - "gemini-flash-latest"          # 15 RPM, 1500 RPD — start here (higher RPM)
    - "gemini-3.1-flash-lite"        # 15 RPM, 250K RPD
    - "gemini-3.1-flash-lite-preview" # 15 RPM, 250K RPD
    - "gemini-3-flash-preview"       # 5 RPM, 250K RPD
    - "gemini-2.5-flash"             # 5 RPM, 250K RPD
    - "gemini-2.5-flash-lite"        # 5 RPM, 250K RPD
    - "gemini-flash-lite-latest"     # 15 RPM, 1500 RPD — final fallback
  # Accounts per Gemini search call
  search_batch_size: 25
  # Pause between batches (free tier is 5-15 requests/minute)
  batch_delay_seconds: 15

# ============================================================
# Gemini synthesis
# ============================================================
gemini:
  # Models tried in order for the synthesis call; first available/under-quota wins.
  # (Selection uses one models.list() call — no ping requests.)
  # Ordered: newest/most capable first; 250K-RPD models preferred over 1500-RPD ones.
  model_candidates:
    - "gemini-3-flash-preview"       # 5 RPM, 250K RPD — newest available
    - "gemini-2.5-flash"             # 5 RPM, 250K RPD
    - "gemini-flash-latest"          # 15 RPM, 1500 RPD (higher RPM if 2.5 quota hit)
    - "gemini-3.1-flash-lite"        # 15 RPM, 250K RPD
    - "gemini-2.5-flash-lite"        # 5 RPM, 250K RPD
    - "gemini-3.1-flash-lite-preview" # 15 RPM, 250K RPD
    - "gemini-flash-lite-latest"     # 15 RPM, 1500 RPD — final fallback
  temperature: 0.4
  max_tokens: 8000

# ============================================================
# Output
# ============================================================
pdf:
  page_size: "A4"
  margins: 72
  include_timestamp: true
  include_sources: true

report:
  title: "AI News Daily Digest"
  top_items: 10

output:
  directory: "./reports"
  filename_prefix: "ai_news_digest"
  timestamp_format: "%Y%m%d_%H%M%S"
