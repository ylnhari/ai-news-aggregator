[project]
name = "ai-news-aggregator"
version = "1.0.0"
description = "Daily AI news brief from free sources (RSS, arXiv, HN), synthesized with Gemini, exported as PDF + Markdown"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.8.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.4",
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires      = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
