[tool.poetry]
name = "ai-news-aggregator"
version = "1.0.0"
description = "Daily AI news brief from free sources (RSS, arXiv, Hacker News), synthesized with Gemini, exported as PDF + Markdown"
authors = ["ai-news-aggregator contributors"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
google-genai = "^2.8.0"
python-dotenv = "^1.0.0"
reportlab = "^4.0.4"
requests = "^2.31.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
